{% assign meta_description = page.description | default: site.description %}
<meta name="description" content="{{ meta_description | strip_html | escape }}">
<meta name="author" content="{{ site.author.name }}">
{% if page.keywords %}
<meta name="keywords" content="{{ page.keywords | escape }}">
{% endif %}
{% if page.og_image %}
<meta property="og:image" content="{{ page.og_image | absolute_url }}">
{% endif %}
{% if page.head %}
{{ page.head }}
{% endif %}
